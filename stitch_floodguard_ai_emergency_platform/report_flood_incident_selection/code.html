<script>
  (function () {
    const cards = document.querySelectorAll('.incident-card');
    const continueBtn = document.getElementById('continue-btn');
    let selectedIncident = null;

    cards.forEach((card) => {
      card.addEventListener('click', () => {
        selectedIncident = card.getAttribute('data-incident');

        cards.forEach((c) => {
          c.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-md');
          c.classList.add('bg-surface-container-lowest/85', 'text-on-surface', 'shadow-sm');
          const title = c.querySelector('.font-title-md');
          const sub = c.querySelector('.font-body-sm');
          const check = c.querySelector('.check-icon');
          if (title) {
            title.classList.remove('text-on-primary');
            title.classList.add('text-on-surface');
          }
          if (sub) {
            sub.classList.remove('text-on-primary/80');
            sub.classList.add('text-on-surface-variant');
          }
          if (check) {
            check.textContent = 'radio_button_unchecked';
            check.classList.remove('text-secondary-fixed');
            check.classList.add('text-on-surface-variant/40');
            check.style.fontVariationSettings = "'FILL' 0";
          }
        });

        card.classList.remove('bg-surface-container-lowest/85', 'text-on-surface', 'shadow-sm');
        card.classList.add('bg-primary-container', 'text-on-primary', 'shadow-md');
        const activeTitle = card.querySelector('.font-title-md');
        const activeSub = card.querySelector('.font-body-sm');
        const activeCheck = card.querySelector('.check-icon');
        if (activeTitle) {
          activeTitle.classList.remove('text-on-surface');
          activeTitle.classList.add('text-on-primary');
        }
        if (activeSub) {
          activeSub.classList.remove('text-on-surface-variant');
          activeSub.classList.add('text-on-primary/80');
        }
        if (activeCheck) {
          activeCheck.textContent = 'check_circle';
          activeCheck.classList.remove('text-on-surface-variant/40');
          activeCheck.classList.add('text-secondary-fixed');
          activeCheck.style.fontVariationSettings = "'FILL' 1";
        }

        continueBtn.disabled = false;
        continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        continueBtn.classList.add('active:scale-[0.98]', 'hover:bg-primary');
      });
    });

    continueBtn.addEventListener('click', () => {
      if (!selectedIncident) return;
      continueBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Loading Step 2...</span>';
    });
  })();
