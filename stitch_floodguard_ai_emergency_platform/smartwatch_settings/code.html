er justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><button class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high/60 transition-all shrink-0" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span></button><h1 class="font-title-md text-title-md text-on-surface truncate">Alert Details</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-space-md pt-16 pb-safe bg-surface/40 min-h-screen"><div class="flex flex-col w-full gap-space-md pb-space-lg">
<div class="relative w-full rounded-xl overflow-hidden shadow-md bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDEOhQOX9OhPBhd7wtGA5KS1PBJEntk9oX3WHQi2VAwmetm3Fkj6NEbJBI7_2DKiLT-rl2ptPaThepI9RuYXcLIYISrAx6wzYQI-AUB1OlOhEp-AFE03iRz3FjQx-SKQj-bDtceGk-B-ilX5p9qiAffYpYByrAgoE1wEr0Ao4aI1PHpD94_4Raep4zjHGnPf8AulL33YAtQ4Eq4CW5Ap7g8Ope6w3DP4lghX2GpRGT4')">
<div class="absolute inset-0 bg-gradient-to-b from-surface/30 via-surface/50 to-surface/85"></div>
<div class="relative z-10 flex flex-col gap-space-md p-space-md">
<div class="bg-surface/85 backdrop-blur-xl rounded-xl p-space-lg shadow-sm flex flex-col gap-space-md">
<div class="flex items-center justify-between gap-space-sm">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-12 h-12 rounded-xl bg-primary-fixed flex items-center justify-center shrink-0 relative">
<span class="material-symbols-outlined text-on-primary-fixed text-[26px]">watch</span>
<span class="absolute top-2 right-2 w-2.5 h-2.5 rounded-full bg-outline" id="watch-status-dot"></span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">FLOODGUARD AI • WEARABLE</span>
<h2 class="font-title-md text-title-md text-on-surface truncate">Smartwatch Companion</h2>
</div>
</div>
<button class="px-space-sm py-1.5 rounded-lg bg-surface-container-high text-on-surface font-label-md text-label-md hover:bg-surface-container-highest transition-colors shrink-0" id="demo-pair-btn" type="button">
            Try Demo
          </button>
</div>
<div class="grid grid-cols-2 gap-space-sm">
<div class="bg-surface-container-low/90 rounded-lg p-space-sm flex flex-col gap-space-xs min-w-0">
<span class="font-label-sm text-label-sm text-on-surface-variant">Connection Status</span>
<span class="font-body-md text-body-md text-on-surface font-medium truncate" id="connection-status-text">Not Connected (Demo / Optional)</span>
</div>
<div class="bg-surface-container-low/90 rounded-lg p-space-sm flex flex-col gap-space-xs min-w-0">
<span class="font-label-sm text-label-sm text-on-surface-variant">Last Sync</span>
<span class="font-body-md text-body-md text-on-surface font-medium truncate" id="last-sync-text">—</span>
</div>
</div>
</div>
<div class="bg-surface/90 backdrop-blur-xl rounded-xl p-space-lg shadow-sm flex flex-col gap-space-md">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-on-surface-variant">Wrist Alert Preferences</span>
<span class="px-2 py-0.5 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm" id="active-count-pill">3 Active</span>
</div>
<div class="flex flex-col gap-space-sm">
<button aria-pressed="true" class="toggle-row w-full bg-surface-container-lowest/95 rounded-xl p-space-md flex items-center justify-between gap-space-sm text-left transition-all hover:bg-surface-container-low" data-toggle="critical" type="button">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-10 h-10 rounded-lg bg-error-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-error-container text-[20px]" style="font-variation-settings: 'FILL' 1;">flood</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-title-md text-title-md text-on-surface truncate">Critical Flood Warnings</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Immediate haptic pulse for severe water rise</span>
</div>
</div>
<div class="toggle-track w-12 h-7 rounded-full bg-secondary p-1 transition-colors shrink-0 flex items-center justify-end">
<div class="toggle-thumb w-5 h-5 rounded-full bg-on-secondary shadow-sm transition-transform"></div>
</div>
</button>
<button aria-pressed="true" class="toggle-row w-full bg-surface-container-lowest/95 rounded-xl p-space-md flex items-center justify-between gap-space-sm text-left transition-all hover:bg-surface-container-low" data-toggle="sos" type="button">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-10 h-10 rounded-lg bg-tertiary-fixed flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-tertiary-fixed text-[20px]" style="font-variation-settings: 'FILL' 1;">sos</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-title-md text-title-md text-on-surface truncate">Emergency SOS Notifications</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Mirror evacuation &amp; rescue dispatches</span>
</div>
</div>
<div class="toggle-track w-12 h-7 rounded-full bg-secondary p-1 transition-colors shrink-0 flex items-center justify-end">
<div class="toggle-thumb w-5 h-5 rounded-full bg-on-secondary shadow-sm transition-transform"></div>
</div>
</button>
<button aria-pressed="true" class="toggle-row w-full bg-surface-container-lowest/95 rounded-xl p-space-md flex items-center justify-between gap-space-sm text-left transition-all hover:bg-surface-container-low" data-toggle="radius" type="button">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-10 h-10 rounded-lg bg-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-secondary-container text-[20px]" style="font-variation-settings: 'FILL' 1;">radar</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-title-md text-title-md text-on-surface truncate">500m Radius Alerts</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Nearby Pune river &amp; drain sensor triggers</span>
</div>
</div>
<div class="toggle-track w-12 h-7 rounded-full bg-secondary p-1 transition-colors shrink-0 flex items-center justify-end">
<div class="toggle-thumb w-5 h-5 rounded-full bg-on-secondary shadow-sm transition-transform"></div>
</div>
</button>
</div>
<div class="bg-surface-container-low/90 rounded-lg p-space-md flex items-start gap-space-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[20px] shrink-0 mt-0.5">info</span>
<p class="font-body-md text-body-md text-on-surface-variant">
            Connect a supported smartwatch to mirror critical flood alerts on your wrist.
          </p>
</div>
</div>
</div>
</div>
</div>
<script>
  (function () {
    const toggleRows = document.querySelectorAll('.toggle-row');
    const activeCountPill = document.getElementById('active-count-pill');
    const demoPairBtn = document.getElementById('demo-pair-btn');
    const statusText = document.getElementById('connection-status-text');
    const lastSyncText = document.getElementById('last-sync-text');
    const statusDot = document.getElementById('watch-status-dot');

    let isDemoConnected = false;

    function updateActiveCount() {
      const activeCount = document.querySelectorAll('.toggle-row[aria-pressed="true"]').length;
      activeCountPill.textContent = activeCount + ' Active';
      if (activeCount === 0) {
        activeCountPill.className = 'px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm';
      } else {
        activeCountPill.className = 'px-2 py-0.5 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm';
      }
    }

    toggleRows.forEach(function (row) {
      row.addEventListener('click', function () {
        const isPressed = row.getAttribute('aria-pressed') === 'true';
        const nextState = !isPressed;
        row.setAttribute('aria-pressed', String(nextState));

        const track = row.querySelector('.toggle-track');
        const thumb = row.querySelector('.toggle-thumb');

        if (nextState) {
          track.classList.remove('bg-surface-container-highest', 'justify-start');
          track.classList.add('bg-secondary', 'justify-end');
          thumb.classList.remove('bg-outline');
          thumb.classList.add('bg-on-secondary');
        } else {
          track.classList.remove('bg-secondary', 'justify-end');
          track.classList.add('bg-surface-container-highest', 'justify-start');
          thumb.classList.remove('bg-on-secondary');
          thumb.classList.add('bg-outline');
        }

        updateActiveCount();
      });
    });

    demoPairBtn.addEventListener('click', function () {
      isDemoConnected = !isDemoConnected;
      if (isDemoConnected) {
        statusText.textContent = 'Connected (Demo Mode)';
        lastSyncText.textContent = 'Just now';
        statusDot.classList.remove('bg-outline');
        statusDot.classList.add('bg-secondary', 'animate-pulse');
        demoPairBtn.textContent = 'Disconnect';
        demoPairBtn.classList.remove('bg-surface-container-high', 'text-on-surface');
        demoPairBtn.classList.add('bg-primary', 'text-on-primary');
      } else {
        statusText.textContent = 'Not Connected (Demo / Optional)';
        lastSyncText.innerHTML = '&mdash;';
        statusDot.classList.remove('bg-secondary', 'animate-pulse');
        statusDot.classList.add('bg-outline');
        demoPairBtn.textContent = 'Try Demo';
        demoPairBtn.classList.remove('bg-primary', 'text-on-primary');
        demoPairBtn.classList.add('bg-surface-container-high', 'text-on-surface');
      }
    });
  })();
</script></main></body></html>
