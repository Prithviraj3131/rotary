<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"tertiary-fixed":"#d1e4ff","on-secondary-container":"#00714e","surface-container":"#eceeed","secondary-container":"#88f5c3","on-error":"#ffffff","surface-container-lowest":"#ffffff","surface-container-high":"#e6e9e8","inverse-surface":"#2e3131","on-secondary-fixed-variant":"#005138","inverse-on-surface":"#eff1f0","surface-tint":"#406659","on-background":"#191c1c","surface-bright":"#f8faf9","on-tertiary":"#ffffff","primary":"#00271d","error":"#ba1a1a","tertiary":"#00223f","background":"#f8faf9","secondary-fixed-dim":"#6edbab","inverse-primary":"#a7cfc0","surface-container-low":"#f2f4f3","primary-fixed":"#c2ebdb","on-tertiary-fixed":"#001d36","on-primary-fixed-variant":"#284e42","on-secondary":"#ffffff","on-primary-fixed":"#002018","on-tertiary-container":"#67a3e4","on-primary-container":"#81a899","secondary-fixed":"#8af7c6","surface-container-highest":"#e1e3e2","on-tertiary-fixed-variant":"#00497c","tertiary-fixed-dim":"#9ecaff","surface":"#f8faf9","secondary":"#006c4b","primary-fixed-dim":"#a7cfc0","surface-variant":"#e1e3e2","on-surface-variant":"#414845","on-primary":"#ffffff","primary-container":"#173d32","surface-dim":"#d8dada","outline-variant":"#c1c8c4","tertiary-container":"#003861","on-surface":"#191c1c","outline":"#717975","error-container":"#ffdad6","on-error-container":"#93000a","on-secondary-fixed":"#002114"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"space-md":"1rem","gutter":"1rem","margin":"1.5rem","space-xl":"2rem","space-xs":"0.25rem","space-lg":"1.5rem","space-sm":"0.5rem"},"fontFamily":{"body-lg":["Inter"],"label-md":["Inter"],"headline-lg":["Inter"],"body-md":["Inter"],"display-lg-mobile":["Inter"],"label-sm":["Inter"],"body-sm":["Inter"],"label-lg":["Inter"],"title-md":["Inter"],"headline-md":["Inter"],"headline-sm":["Inter"],"display-lg":["Inter"]},"fontSize":{"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"500"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.015em","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"display-lg-mobile":["28px",{"lineHeight":"34px","letterSpacing":"-0.02em","fontWeight":"700"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.04em","fontWeight":"600"}],"body-sm":["12px",{"lineHeight":"16px","fontWeight":"400"}],"label-lg":["14px",{"lineHeight":"20px","fontWeight":"500"}],"title-md":["16px",{"lineHeight":"24px","fontWeight":"600"}],"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-sm":["20px",{"lineHeight":"28px","fontWeight":"600"}],"display-lg":["40px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"700"}]}}}}</script></head><body class="bg-surface text-on-surface flex flex-col min-h-screen"><div class="fixed inset-0 -z-10 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDEOhQOX9OhPBhd7wtGA5KS1PBJEntk9oX3WHQi2VAwmetm3Fkj6NEbJBI7_2DKiLT-rl2ptPaThepI9RuYXcLIYISrAx6wzYQI-AUB1OlOhEp-AFE03iRz3FjQx-SKQj-bDtceGk-B-ilX5p9qiAffYpYByrAgoE1wEr0Ao4aI1PHpD94_4Raep4zjHGnPf8AulL33YAtQ4Eq4CW5Ap7g8Ope6w3DP4lghX2GpRGT4');"></div><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-space-md flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><button class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high/60 transition-all shrink-0" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span></button><h1 class="font-title-md text-title-md text-on-surface truncate">Login</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-space-md pt-16 pb-safe bg-surface/40 min-h-screen"><div class="flex flex-col w-full">
<div class="fixed inset-0 -z-10 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDEOhQOX9OhPBhd7wtGA5KS1PBJEntk9oX3WHQi2VAwmetm3Fkj6NEbJBI7_2DKiLT-rl2ptPaThepI9RuYXcLIYISrAx6wzYQI-AUB1OlOhEp-AFE03iRz3FjQx-SKQj-bDtceGk-B-ilX5p9qiAffYpYByrAgoE1wEr0Ao4aI1PHpD94_4Raep4zjHGnPf8AulL33YAtQ4Eq4CW5Ap7g8Ope6w3DP4lghX2GpRGT4');"></div>
<div class="fixed inset-0 -z-10 bg-gradient-to-b from-surface/30 via-surface/20 to-surface/60"></div>
<div class="flex flex-col w-full py-space-lg">
<div class="w-full rounded-xl bg-surface/70 backdrop-blur-xl shadow-lg p-space-lg flex flex-col gap-space-lg">
<div class="flex items-center justify-between">
<div class="inline-flex items-center gap-space-xs px-space-sm py-space-xs rounded-full bg-secondary-container/80 text-on-secondary-container">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="font-label-sm text-label-sm">PUNE BASIN • LIVE</span>
</div>
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<h2 class="font-headline-md text-headline-md text-on-surface">Welcome to FloodGuard AI</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Precision hydrological intelligence &amp; early flood alerts for your neighborhood.</p>
</div>
<form class="flex flex-col gap-space-md" id="auth-form" novalidate="">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="full-name">Full Name</label>
<div class="relative flex items-center w-full h-12 rounded-lg bg-surface-container-lowest shadow-sm">
<span class="material-symbols-outlined text-outline text-[20px] pl-space-md pr-space-sm shrink-0">person</span>
<input autocomplete="name" class="w-full h-full bg-transparent pr-space-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="full-name" placeholder="e.g., Aarav Deshmukh" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="mobile-number">Mobile Number</label>
<div class="relative flex items-center w-full h-12 rounded-lg bg-surface-container-lowest shadow-sm overflow-hidden">
<div class="h-full px-space-md flex items-center gap-space-xs bg-surface-container-low text-on-surface shrink-0">
<span class="font-label-lg text-label-lg">+91</span>
</div>
<input autocomplete="tel-national" class="w-full h-full bg-transparent px-space-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="mobile-number" inputmode="numeric" maxlength="10" placeholder="98230 XXXXX" required="" type="tel"/>
</div>
</div>
<button aria-checked="false" class="flex items-start gap-space-sm text-left py-space-xs group focus:outline-none" id="consent-toggle" role="checkbox" type="button">
<span class="w-5 h-5 mt-0.5 rounded bg-surface-container-lowest shadow-sm flex items-center justify-center shrink-0 transition-colors" id="consent-box">
<span class="material-symbols-outlined text-on-secondary text-[16px] opacity-0 transition-opacity" id="consent-check">check</span>
</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">I agree to the <span class="font-label-md text-label-md text-secondary">Privacy Policy</span> and emergency alert terms.</span>
</button>
<p class="hidden font-body-sm text-body-sm text-error bg-error-container/70 px-space-sm py-space-xs rounded-lg" id="form-feedback"></p>
<button class="w-full h-12 rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg shadow-md flex items-center justify-center gap-space-sm active:scale-[0.99] transition-transform" id="send-otp-btn" type="submit">
<span id="btn-label">Send OTP</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="hidden flex-col gap-space-md pt-space-xs" id="otp-confirmation">
<div class="flex items-center gap-space-sm p-space-sm rounded-lg bg-secondary-container/60 text-on-secondary-container">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<p class="font-body-sm text-body-sm" id="otp-sent-msg">Verification code sent.</p>
</div>
<button class="w-full h-12 rounded-lg bg-surface-container-lowest text-on-surface font-label-lg text-label-lg shadow-sm flex items-center justify-center" id="reset-form-btn" type="button">
          Edit Mobile Number
        </button>
</div>
<div class="flex items-center justify-center gap-space-xs pt-space-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span class="font-body-sm text-body-sm">Encrypted emergency alert registration</span>
</div>
</div>
</div>
</div>
<script>
  (function () {
    const consentToggle = document.getElementById('consent-toggle');
    const consentBox = document.getElementById('consent-box');
    const consentCheck = document.getElementById('consent-check');
    const authForm = document.getElementById('auth-form');
    const fullNameInput = document.getElementById('full-name');
    const mobileInput = document.getElementById('mobile-number');
    const feedback = document.getElementById('form-feedback');
    const otpConfirmation = document.getElementById('otp-confirmation');
    const otpSentMsg = document.getElementById('otp-sent-msg');
    const resetFormBtn = document.getElementById('reset-form-btn');

    let isConsented = false;

    consentToggle.addEventListener('click', function () {
      isConsented = !isConsented;
      consentToggle.setAttribute('aria-checked', String(isConsented));
      if (isConsented) {
        consentBox.classList.remove('bg-surface-container-lowest');
        consentBox.classList.add('bg-secondary');
        consentCheck.classList.remove('opacity-0');
        consentCheck.classList.add('opacity-100');
      } else {
        consentBox.classList.add('bg-surface-container-lowest');
        consentBox.classList.remove('bg-secondary');
        consentCheck.classList.add('opacity-0');
        consentCheck.classList.remove('opacity-100');
      }
      feedback.classList.add('hidden');
    });

    mobileInput.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '').slice(0, 10);
      feedback.classList.add('hidden');
    });

    fullNameInput.addEventListener('input', function () {
      feedback.classList.add('hidden');
    });

    authForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const name = fullNameInput.value.trim();
      const mobile = mobileInput.value.trim();

      if (!name) {
        feedback.textContent = 'Please enter your full name.';
        feedback.classList.remove('hidden');
        fullNameInput.focus();
        return;
      }

      if (mobile.length < 10) {
        feedback.textContent = 'Please enter a valid 10-digit Indian mobile number.';
        feedback.classList.remove('hidden');
        mobileInput.focus();
        return;
      }

      if (!isConsented) {
        feedback.textContent = 'Please agree to the Privacy Policy and emergency alert terms.';
        feedback.classList.remove('hidden');
        return;
      }

      feedback.classList.add('hidden');
      authForm.classList.add('hidden');
      otpSentMsg.textContent = 'OTP sent to +91 ' + mobile.slice(0, 5) + ' ' + mobile.slice(5) + ' for ' + name + '.';
      otpConfirmation.classList.remove('hidden');
      otpConfirmation.classList.add('flex');
    });

    resetFormBtn.addEventListener('click', function () {
      otpConfirmation.classList.add('hidden');
      otpConfirmation.classList.remove('flex');
      authForm.classList.remove('hidden');
      mobileInput.focus();
    });
  })();
</script></main></body></html>
