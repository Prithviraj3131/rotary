er justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><button class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high/60 transition-all shrink-0" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span></button><h1 class="font-title-md text-title-md text-on-surface truncate">Onboarding</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-space-md pt-16 pb-safe bg-surface/40 min-h-screen"><div class="flex flex-col w-full gap-space-md pb-space-lg">
<div class="relative w-full rounded-xl overflow-hidden shadow-md bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDEOhQOX9OhPBhd7wtGA5KS1PBJEntk9oX3WHQi2VAwmetm3Fkj6NEbJBI7_2DKiLT-rl2ptPaThepI9RuYXcLIYISrAx6wzYQI-AUB1OlOhEp-AFE03iRz3FjQx-SKQj-bDtceGk-B-ilX5p9qiAffYpYByrAgoE1wEr0Ao4aI1PHpD94_4Raep4zjHGnPf8AulL33YAtQ4Eq4CW5Ap7g8Ope6w3DP4lghX2GpRGT4')">
<div class="absolute inset-0 bg-gradient-to-b from-surface/20 via-surface/35 to-surface/80"></div>
<div class="relative z-10 flex flex-col justify-between p-space-md gap-space-lg">
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-sm bg-surface/85 backdrop-blur-md px-space-sm py-space-xs rounded-full shadow-sm">
<span class="material-symbols-outlined text-secondary text-[18px]" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span class="font-label-sm text-label-sm text-on-surface tracking-wider uppercase">FLOODGUARD AI</span>
</div>
<button class="px-space-md py-space-xs rounded-full bg-surface/80 backdrop-blur-md text-on-surface-variant font-label-lg text-label-lg hover:bg-surface transition-all active:scale-95" id="skip-btn" type="button">
          Skip
        </button>
</div>
<div class="bg-surface/90 backdrop-blur-xl rounded-xl p-space-lg shadow-xl flex flex-col items-center text-center gap-space-lg mt-space-xl">
<div class="w-20 h-20 rounded-full bg-secondary-container/40 flex items-center justify-center transition-all duration-300" id="slide-icon-wrap">
<span class="material-symbols-outlined text-secondary text-[40px]" id="slide-icon" style="font-variation-settings: 'FILL' 1;">rainy</span>
</div>
<div class="flex flex-col gap-space-sm min-h-[104px] justify-center">
<h2 class="font-headline-md text-headline-md text-on-surface transition-opacity duration-200" id="slide-title">
            Know Before It Floods
          </h2>
<p class="font-body-md text-body-md text-on-surface-variant transition-opacity duration-200" id="slide-desc">
            Receive predictive local flood warnings.
          </p>
</div>
<div aria-label="Onboarding slides" class="flex items-center justify-center gap-space-sm" id="slide-dots" role="tablist">
<button aria-label="Slide 1" class="dot-btn h-2 w-6 rounded-full bg-primary-container transition-all duration-300" data-slide="0" type="button"></button>
<button aria-label="Slide 2" class="dot-btn h-2 w-2 rounded-full bg-outline-variant transition-all duration-300" data-slide="1" type="button"></button>
<button aria-label="Slide 3" class="dot-btn h-2 w-2 rounded-full bg-outline-variant transition-all duration-300" data-slide="2" type="button"></button>
</div>
<button class="w-full py-space-md px-space-lg rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-sm hover:opacity-95 active:scale-[0.98] transition-all" id="next-btn" type="button">
<span id="next-btn-label">Next</span>
<span class="material-symbols-outlined text-[20px]" id="next-btn-icon">arrow_forward</span>
</button>
</div>
</div>
</div>
</div>
<script>
  (function () {
    const slides = [
      {
        title: "Know Before It Floods",
        desc: "Receive predictive local flood warnings.",
        icon: "rainy"
      },
      {
        title: "Stay Safe",
        desc: "Find safer routes and nearby safe facilities.",
        icon: "alt_route"
      },
      {
        title: "Stay Connected",
        desc: "Report emergencies and communicate when internet connectivity is unavailable.",
        icon: "cell_tower"
      }
    ];

    let current = 0;

    const iconEl = document.getElementById("slide-icon");
    const iconWrapEl = document.getElementById("slide-icon-wrap");
    const titleEl = document.getElementById("slide-title");
    const descEl = document.getElementById("slide-desc");
    const nextBtn = document.getElementById("next-btn");
    const nextLabel = document.getElementById("next-btn-label");
    const nextIcon = document.getElementById("next-btn-icon");
    const skipBtn = document.getElementById("skip-btn");
    const dotBtns = document.querySelectorAll(".dot-btn");

    function renderSlide(index) {
      current = index;
      const slide = slides[current];

      titleEl.style.opacity = "0";
      descEl.style.opacity = "0";
      iconWrapEl.style.transform = "scale(0.92)";

      setTimeout(() => {
        iconEl.textContent = slide.icon;
        titleEl.textContent = slide.title;
        descEl.textContent = slide.desc;

        titleEl.style.opacity = "1";
        descEl.style.opacity = "1";
        iconWrapEl.style.transform = "scale(1)";
      }, 150);

      dotBtns.forEach((dot, i) => {
        if (i === current) {
          dot.classList.remove("w-2", "bg-outline-variant");
          dot.classList.add("w-6", "bg-primary-container");
        } else {
          dot.classList.remove("w-6", "bg-primary-container");
          dot.classList.add("w-2", "bg-outline-variant");
        }
      });

      if (current === slides.length - 1) {
        nextLabel.textContent = "Get Started";
        nextIcon.textContent = "check_circle";
      } else {
        nextLabel.textContent = "Next";
        nextIcon.textContent = "arrow_forward";
      }
    }

    nextBtn.addEventListener("click", () => {
      if (current < slides.length - 1) {
        renderSlide(current + 1);
      } else {
        renderSlide(0);
      }
    });

    skipBtn.addEventListener("click", () => {
      renderSlide(slides.length - 1);
    });

    dotBtns.forEach((dot) => {
      dot.addEventListener("click", () => {
        const idx = parseInt(dot.getAttribute("data-slide"), 10);
        if (!isNaN(idx)) {
          renderSlide(idx);
        }
      });
    });
  })();
</script></main></body></html>
