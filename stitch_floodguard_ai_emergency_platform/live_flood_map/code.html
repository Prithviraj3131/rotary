<script>
  const chips = document.querySelectorAll('.filter-chip');
  const markers = document.querySelectorAll('.map-marker');
  const searchInput = document.getElementById('map-search');
  const clearBtn = document.getElementById('clear-search');
  const recenterBtn = document.getElementById('recenter-btn');

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => {
        c.classList.remove('bg-primary', 'text-on-primary');
        c.classList.add('bg-surface-container-lowest/90', 'text-on-surface');
      });
      chip.classList.remove('bg-surface-container-lowest/90', 'text-on-surface');
      chip.classList.add('bg-primary', 'text-on-primary');

      const filter = chip.dataset.filter;
      markers.forEach(m => {
        if (filter === 'all' || m.dataset.category.includes(filter)) {
          m.classList.remove('hidden');
        } else {
          m.classList.add('hidden');
        }
      });
    });
  });

  searchInput.addEventListener('input', () => {
    clearBtn.classList.toggle('hidden', searchInput.value.length === 0);
  });

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.classList.add('hidden');
  });

  recenterBtn.addEventListener('click', () => {
    recenterBtn.classList.add('bg-primary', 'text-on-primary');
    setTimeout(() => {
      recenterBtn.classList.remove('bg-primary', 'text-on-primary');
    }, 400);
  });

  function selectSpot(title, status, depth, advisory, tone) {
    document.getElementById('sheet-title').textContent = title;
    document.getElementById('sheet-depth').textContent = depth;
    document.getElementById('sheet-advisory').textContent = advisory;

    const badge = document.getElementById('sheet-badge');
    badge.textContent = status;
    badge.className = 'px-2 py-0.5 rounded-full font-label-sm text-label-sm ';

    const depthEl = document.getElementById('sheet-depth');
    depthEl.className = 'font-headline-sm text-headline-sm ';

    if (tone === 'error') {
      badge.classList.add('bg-error-container', 'text-on-error-container');
      depthEl.classList.add('text-error');
    } else if (tone === 'tertiary') {
      badge.classList.add('bg-tertiary-fixed', 'text-on-tertiary-fixed');
      depthEl.classList.add('text-tertiary');
    } else if (tone === 'secondary') {
      badge.classList.add('bg-secondary-container', 'text-on-secondary-container');
      depthEl.classList.add('text-secondary');
    } else {
      badge.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
      depthEl.classList.add('text-primary');
    }
  }
