er justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><button class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high/60 transition-all shrink-0" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span></button><h1 class="font-title-md text-title-md text-on-surface truncate">Otp Verification</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-space-md pt-16 pb-safe bg-surface/40 min-h-screen"><div class="flex flex-col w-full">
<div class="fixed inset-0 -z-10 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDEOhQOX9OhPBhd7wtGA5KS1PBJEntk9oX3WHQi2VAwmetm3Fkj6NEbJBI7_2DKiLT-rl2ptPaThepI9RuYXcLIYISrAx6wzYQI-AUB1OlOhEp-AFE03iRz3FjQx-SKQj-bDtceGk-B-ilX5p9qiAffYpYByrAgoE1wEr0Ao4aI1PHpD94_4Raep4zjHGnPf8AulL33YAtQ4Eq4CW5Ap7g8Ope6w3DP4lghX2GpRGT4')"></div>
<div class="fixed inset-0 -z-10 bg-surface/35 backdrop-blur-[2px]"></div>
<div class="w-full py-space-lg flex flex-col gap-space-lg">
<div class="w-full bg-surface/85 backdrop-blur-xl rounded-xl shadow-xl p-space-lg flex flex-col gap-space-lg">
<div class="flex items-center justify-between">
<div class="inline-flex items-center gap-space-xs px-space-sm py-space-xs rounded-full bg-primary-fixed/80 text-on-primary-fixed">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">FloodGuard AI</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Step 2 of 2</span>
</div>
<div class="flex flex-col gap-space-xs">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Verify Your Number</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
          Enter the 6-digit code sent to <span class="font-label-lg text-label-lg text-on-surface">+91 98230 45120</span>
</p>
</div>
<div class="grid grid-cols-6 gap-space-sm w-full" id="otp-group">
<input aria-label="OTP digit 1" class="otp-input w-full h-14 bg-surface-container-lowest/85 backdrop-blur-md rounded-lg shadow-sm text-center font-headline-md text-headline-md text-on-surface focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" inputmode="numeric" maxlength="1" type="text" value="4"/>
<input aria-label="OTP digit 2" class="otp-input w-full h-14 bg-surface-container-lowest/85 backdrop-blur-md rounded-lg shadow-sm text-center font-headline-md text-headline-md text-on-surface focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" inputmode="numeric" maxlength="1" type="text" value="8"/>
<input aria-label="OTP digit 3" class="otp-input w-full h-14 bg-surface-container-lowest/85 backdrop-blur-md rounded-lg shadow-sm text-center font-headline-md text-headline-md text-on-surface focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="OTP digit 4" class="otp-input w-full h-14 bg-surface-container-lowest/85 backdrop-blur-md rounded-lg shadow-sm text-center font-headline-md text-headline-md text-on-surface focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="OTP digit 5" class="otp-input w-full h-14 bg-surface-container-lowest/85 backdrop-blur-md rounded-lg shadow-sm text-center font-headline-md text-headline-md text-on-surface focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="OTP digit 6" class="otp-input w-full h-14 bg-surface-container-lowest/85 backdrop-blur-md rounded-lg shadow-sm text-center font-headline-md text-headline-md text-on-surface focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" inputmode="numeric" maxlength="1" type="text"/>
</div>
<div class="flex items-center justify-between">
<button class="font-label-lg text-label-lg text-secondary disabled:opacity-80 transition-opacity text-left" disabled="" id="resend-btn" type="button">
          Resend OTP in <span id="otp-timer">0:28</span>
</button>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" type="button">
          Change number
        </button>
</div>
<button class="w-full h-12 rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg shadow-md hover:bg-primary active:scale-[0.99] transition-all flex items-center justify-center gap-space-sm" id="verify-btn" type="button">
<span>Verify &amp; Continue</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<div class="w-full bg-surface/70 backdrop-blur-md rounded-xl p-space-md flex items-center gap-space-sm shadow-sm">
<span class="material-symbols-outlined text-[20px] text-secondary shrink-0">lock</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        Secured hydrological alert access for Pune Municipal &amp; Sahyadri Basin responders.
      </p>
</div>
</div>
</div>
<script>
  (function () {
    const inputs = Array.from(document.querySelectorAll('.otp-input'));
    const resendBtn = document.getElementById('resend-btn');
    const timerEl = document.getElementById('otp-timer');
    const verifyBtn = document.getElementById('verify-btn');

    inputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/\D/g, '');
        e.target.value = val.slice(0, 1);
        if (val && idx < inputs.length - 1) {
          inputs[idx + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && idx > 0) {
          inputs[idx - 1].focus();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
        pasted.split('').forEach((char, i) => {
          if (inputs[i]) inputs[i].value = char;
        });
        const nextIdx = Math.min(pasted.length, inputs.length - 1);
        inputs[nextIdx].focus();
      });
    });

    let seconds = 28;
    const interval = setInterval(() => {
      seconds -= 1;
      if (seconds <= 0) {
        clearInterval(interval);
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend OTP';
      } else {
        timerEl.textContent = '0:' + String(seconds).padStart(2, '0');
      }
    }, 1000);

    verifyBtn.addEventListener('click', () => {
      verifyBtn.classList.add('opacity-90');
      verifyBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>Verifying...</span>';
      setTimeout(() => {
        verifyBtn.classList.remove('opacity-90');
        verifyBtn.innerHTML = '<span>Verify &amp; Continue</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
      }, 900);
    });
  })();
</script></main></body></html>
